<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火柴人骨架调参</title>
<style>
:root{--bg:#e6e8e4;--panel:#f3f4f1;--ink:#20262a;--mute:#6b7370;--line:#c9cdc6;--grid:#d6d9d3;--accent:#3f6f86;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2022;--panel:#252a2d;--ink:#e3e6e2;--mute:#9aa29e;--line:#3a4144;--grid:#30373a;--accent:#7fb0c6}}
:root[data-theme="dark"]{--bg:#1c2022;--panel:#252a2d;--ink:#e3e6e2;--mute:#9aa29e;--line:#3a4144;--grid:#30373a;--accent:#7fb0c6}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
main{max-width:1280px;margin:0 auto;padding:20px}
h1{font-size:19px;font-weight:600;margin:0 0 14px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 11px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.view{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.view h2{font-size:13px;font-weight:500;color:var(--mute);margin:8px 12px 0}
canvas{display:block;width:100%;height:440px}
.time{display:flex;gap:12px;align-items:center;margin:12px 0}
.time input{flex:1}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:6px}
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px}
.sliders label{display:grid;grid-template-columns:5.5em 1fr 3.6em;align-items:center;gap:8px}
.sliders output{text-align:right;font-variant-numeric:tabular-nums}
.group{grid-column:1/-1;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);margin-top:8px;padding-bottom:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;height:230px;font:12px/1.45 ui-monospace,Consolas,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.note{color:var(--mute);font-size:12px}
@media (max-width:820px){.views,.cols,.sliders{grid-template-columns:1fr}canvas{height:340px}main{padding:12px}}
</style></head><body><main>
<h1>火柴人骨架调参</h1>
<div class="top">
<select id="clip" aria-label="动作"></select>
<button id="play">暂停</button>
<label>速度 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></label>
<label><input type="checkbox" id="loop" checked> 循环</label>
</div>
<div class="views">
<section class="view"><h2>正面</h2><canvas id="c0"></canvas></section>
<section class="view"><h2>自由视角（朝向、俯视在下面调）</h2><canvas id="c1"></canvas></section>
</div>
<div class="time"><span id="t">0.00 s</span><input id="frame" type="range" min="0" max="1" step="1" aria-label="逐帧"><span id="fn"></span></div>
<div class="cols">
<div class="sliders" id="sliders"></div>
<div>
<div class="row" style="margin-top:0"><button id="copy">复制参数</button><button id="reset">恢复默认</button><span class="note" id="msg"></span></div>
<div class="row"><span id="heads"></span></div><div class="row"><span class="note">当前参数（源动作保持不变）</span></div>
<textarea id="out" readonly aria-label="当前参数"></textarea>
</div></div>
</main>
<script type="module" src="./study.mjs"></script></body></html>
