<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D → 2D Asset Import Spike</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #151515; color: #ddd; font: 13px/1.45 system-ui, sans-serif; }
  #app { position: absolute; inset: 0 290px 0 0; display: grid; place-items: center; }
  #app canvas { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
  #panel { position: absolute; inset: 0 0 0 auto; width: 290px; padding: 18px; background: #202020; border-left: 1px solid #444; overflow: auto; }
  h1 { margin: 0 0 6px; font-size: 17px; color: #fff; }
  h2 { margin: 20px 0 7px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: .08em; }
  p { margin: 5px 0 10px; }
  label { display: block; margin: 10px 0 2px; }
  input[type=range] { width: 100%; }
  .presets { display: flex; gap: 6px; margin: 5px 0 12px; }
  .presets button { flex: 1; padding: 4px; color: #ccc; background: #2b2b2b; border: 1px solid #484848; cursor: pointer; }
  .presets button:hover { background: #383838; color: #fff; }
  .value { float: right; color: #fff; font-variant-numeric: tabular-nums; }
  .legend { display: grid; grid-template-columns: 14px 1fr; gap: 7px 8px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .old { background: #aaa; border: 1px solid #333; }
  .new { background: #d0d0d0; border: 2px solid #333; }
  .back { background: #666; }
  .front { background: #222; }
  #status { margin-top: 12px; padding: 10px; min-height: 62px; background: #181818; border: 1px solid #333; color: #aaa; white-space: pre-wrap; }
  #status.ok { color: #a9d8b1; }
  #status.err { color: #ff9c91; }
  code { color: #d8d8d8; }
</style>
</head>
<body>
<div id="app"></div>
<aside id="panel">
  <h1>CC0 资源转换样片</h1>
  <p>左：当前程序化树。右：从 Kenney <code>tree_oak.glb</code> 实时烘焙出的高分辨率灰阶 2D 纹理。</p>

  <h2>观察</h2>
  <label>相机缩放 <span class="value" id="zoomValue">1.50×</span></label>
  <input id="zoom" type="range" min="0.5" max="3.0" step="0.1" value="1.5">
  <div class="presets"><button data-zoom="0.5">宽景</button><button data-zoom="1.5">中景</button><button data-zoom="3.0">近景</button></div>
  <label>导入树高度 <span class="value" id="heightValue">4.0 m</span></label>
  <input id="height" type="range" min="2.5" max="6.0" step="0.1" value="4.0">
  <label for="facet">树冠切面色差 <span class="value" id="facetValue">--%</span></label>
  <input id="facet" type="range" min="0" max="100" step="1">
  <label hidden><input id="outline" type="checkbox"> 外轮廓（预留）</label>

  <h2>遮挡验证</h2>
  <div class="legend">
    <span class="dot old"></span><span>当前程序化树</span>
    <span class="dot new"></span><span>GLB → 灰阶透明纹理</span>
    <span class="dot back"></span><span>深灰人：在树后</span>
    <span class="dot front"></span><span>黑色人：在树前</span>
  </div>

  <h2>转换结果</h2>
  <div id="status">正在载入 3D 模型并烘焙……</div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { toScreen, toScreenLength, projectGroundRect } from '../js/core/Projection.js';
import { UNITS_PER_METER } from '../js/core/Layout.js';
import { PropEntity } from '../js/core/PropEntity.js';
import { StickRenderer } from '../js/core/StickRenderer.js';
import { clipLibrary } from '../js/core/ClipLibrary.js';

const VIEW_W = 1080;
const VIEW_H = 720;
const app = new PIXI.Application({ width: VIEW_W, height: VIEW_H, backgroundColor: 0xb4b4b4, antialias: true });
document.getElementById('app').appendChild(app.view);

const world = new PIXI.Container();
world.sortableChildren = true;
app.stage.addChild(world);

const ground = new PIXI.Graphics();
ground.zIndex = -100000;
world.addChild(ground);

const statusEl = document.getElementById('status');
const zoomEl = document.getElementById('zoom');
const heightEl = document.getElementById('height');
const facetEl = document.getElementById('facet');
const outlineEl = document.getElementById('outline');
const sourceTreePromise = new GLTFLoader().loadAsync('./asset-import-spike/source/tree_oak.glb');
let renderSettings = null;

async function loadRenderSettings() {
  const response = await fetch('./asset-import-spike/render-settings.json');
  if (!response.ok) throw new Error(`转换参数读取失败：HTTP ${response.status}`);
  const settings = await response.json();
  if (!Number.isFinite(settings.facetContrast) || settings.facetContrast < 0 || settings.facetContrast > 100) {
    throw new Error('render-settings.json: facetContrast 必须为 0–100');
  }
  if (typeof settings.outlineVisible !== 'boolean') {
    throw new Error('render-settings.json: outlineVisible 必须为布尔值');
  }
  if (!Array.isArray(settings.light?.position) || settings.light.position.length !== 3 ||
      !settings.light.position.every(Number.isFinite)) {
    throw new Error('render-settings.json: light.position 必须为三个数值');
  }
  return settings;
}

function drawGround() {
  ground.clear();
  ground.lineStyle(0);
  ground.beginFill(0xbdbdbd, 1);
  ground.drawPolygon(projectGroundRect(-1800, 1200, 1800, 2050));
  ground.endFill();
  for (let y = 1250; y <= 2000; y += 100) {
    const a = toScreen(-1800, y), b = toScreen(1800, y);
    ground.lineStyle(y === 1600 ? 1.2 : 0.6, y === 1600 ? 0x777777 : 0x9e9e9e, y === 1600 ? 0.6 : 0.35);
    ground.moveTo(a.x, a.y); ground.lineTo(b.x, b.y);
  }
}
drawGround();

function makeCurrentTree(x, y) {
  const e = new PropEntity({ propType: 'tree', x, y, width: 300, height: 300 });
  e.scale = 1;
  const g = new PIXI.Graphics();
  e.draw(g);
  g.zIndex = e._sortY;
  world.addChild(g);
  return { node: g, sortY: e._sortY };
}

async function makeNpc(x, y, color, dir = 1) {
  await clipLibrary.init();
  await clipLibrary.getClip('stand');
  const stick = new StickRenderer({});
  stick.setSkeletons(clipLibrary.skeletons);
  stick.loadAnimation('stand', clipLibrary.resolve('stand'));
  const g = new PIXI.Graphics();
  stick.draw(g, 'stand', 0, x, y, 1, dir, color, 1, null, null);
  g.zIndex = y;
  world.addChild(g);
  return g;
}

function sourceGray(oldMaterial) {
  const c = oldMaterial?.color ?? new THREE.Color(0.7, 0.7, 0.7);
  // Kenney 的树干偏橙、树冠偏青：只用原材质做部件判定，最终输出仍是项目灰阶。
  const trunkLike = c.r > c.g * 1.08;
  return trunkLike ? 0x888888 : 0xc4c4c4;
}

function facetLightIntensity() {
  return (+facetEl.value / 100) * 2.1;
}

async function bakeTree() {
  const SIZE = 1024;
  const bakeCanvas = document.createElement('canvas');
  bakeCanvas.width = bakeCanvas.height = SIZE;
  const renderer = new THREE.WebGLRenderer({ canvas: bakeCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(SIZE, SIZE, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  // 保留低模切面，但把面间色差限制在一个很小的范围内：
  // 环境光负责稳定底色，弱方向光只让朝向不同的面略有明暗变化。
  scene.add(new THREE.AmbientLight(0xffffff, 2.85));
  const key = new THREE.DirectionalLight(0xffffff, facetLightIntensity());
  key.position.set(...renderSettings.light.position);
  scene.add(key);
  const gltf = await sourceTreePromise;
  const root = gltf.scene.clone(true);
  const sourceBox = new THREE.Box3().setFromObject(root);
  const sourceSize = sourceBox.getSize(new THREE.Vector3());
  const sourceCenter = sourceBox.getCenter(new THREE.Vector3());
  root.position.set(-sourceCenter.x, -sourceBox.min.y, -sourceCenter.z);

  const meshes = [];
  root.traverse(o => { if (o.isMesh) meshes.push(o); });
  for (const mesh of meshes) {
    const old = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    mesh.material = new THREE.MeshLambertMaterial({
      color: sourceGray(old),
      flatShading: true,
    });
  }
  scene.add(root);

  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const target = new THREE.Vector3(0, size.y * 0.47, 0);
  const span = Math.max(size.x, size.y) * 1.16;
  const camera = new THREE.OrthographicCamera(-span / 2, span / 2, span / 2, -span / 2, 0.01, 1000);
  const elevation = THREE.MathUtils.degToRad(20);
  const azimuth = THREE.MathUtils.degToRad(24);
  const distance = Math.max(size.x, size.y, size.z) * 8;
  camera.position.set(
    Math.sin(azimuth) * Math.cos(elevation) * distance,
    target.y + Math.sin(elevation) * distance,
    Math.cos(azimuth) * Math.cos(elevation) * distance
  );
  camera.lookAt(target);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);

  const groundNdc = new THREE.Vector3(0, 0, 0).project(camera);
  const anchorFull = {
    x: (groundNdc.x + 1) * 0.5 * SIZE,
    y: (1 - groundNdc.y) * 0.5 * SIZE,
  };

  const image = new Image();
  image.src = bakeCanvas.toDataURL('image/png');
  await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; });
  const read = document.createElement('canvas');
  read.width = read.height = SIZE;
  const ctx = read.getContext('2d');
  ctx.drawImage(image, 0, 0);
  const pixels = ctx.getImageData(0, 0, SIZE, SIZE).data;
  let minX = SIZE, minY = SIZE, maxX = -1, maxY = -1;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    if (pixels[(y * SIZE + x) * 4 + 3] < 4) continue;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  if (maxX < minX) throw new Error('烘焙结果为空');
  const margin = 8;
  minX = Math.max(0, minX - margin); minY = Math.max(0, minY - margin);
  maxX = Math.min(SIZE - 1, maxX + margin); maxY = Math.min(SIZE - 1, maxY + margin);
  const out = document.createElement('canvas');
  out.width = maxX - minX + 1; out.height = maxY - minY + 1;
  out.getContext('2d').drawImage(read, minX, minY, out.width, out.height, 0, 0, out.width, out.height);

  renderer.dispose();
  return {
    canvas: out,
    sourceSize,
    anchor: { x: (anchorFull.x - minX) / out.width, y: (anchorFull.y - minY) / out.height },
  };
}

function makeImportedTree(baked, x, y) {
  const container = new PIXI.Container();
  container.position.copyFrom(toScreen(x, y));
  // 与当前 tree 保持同一个排序语义，验证人物可以从树后走到树前。
  container.zIndex = y + 23 - 300 * 0.35;

  const texture = PIXI.Texture.from(baked.canvas);
  texture.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
  const offsets = [[-.65,0],[.65,0],[0,-.65],[0,.65],[-.45,-.45],[.45,-.45],[-.45,.45],[.45,.45]];
  const outlines = offsets.map(([ox, oy]) => {
    const s = new PIXI.Sprite(texture);
    s.anchor.set(baked.anchor.x, baked.anchor.y);
    s.position.set(ox, oy);
    s.tint = 0x4a4a4a;
    container.addChild(s);
    return s;
  });
  const main = new PIXI.Sprite(texture);
  main.anchor.set(baked.anchor.x, baked.anchor.y);
  container.addChild(main);
  world.addChild(container);
  return { container, main, outlines, baked };
}

function replaceImportedTexture(tree, baked) {
  const oldTexture = tree.main.texture;
  const texture = PIXI.Texture.from(baked.canvas);
  texture.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
  for (const sprite of [tree.main, ...tree.outlines]) {
    sprite.texture = texture;
    sprite.anchor.set(baked.anchor.x, baked.anchor.y);
  }
  tree.baked = baked;
  oldTexture.destroy(true);
}

function fitCamera() {
  const zoom = +zoomEl.value;
  const focus = toScreen(0, 1600);
  world.scale.set(zoom);
  world.position.set(VIEW_W / 2 - focus.x * zoom, VIEW_H * 0.64 - focus.y * zoom);
  document.getElementById('zoomValue').textContent = zoom.toFixed(2) + '×';
}

function resizeImported(tree) {
  const meters = +heightEl.value;
  const desiredPx = toScreenLength(meters * UNITS_PER_METER);
  const s = desiredPx / tree.baked.canvas.height;
  tree.main.scale.set(s);
  for (const o of tree.outlines) o.scale.set(s);
  for (const o of tree.outlines) o.visible = outlineEl.checked;
  document.getElementById('heightValue').textContent = meters.toFixed(1) + ' m';
}

function showStatus(baked) {
  const ss = baked.sourceSize;
  statusEl.className = 'ok';
  statusEl.textContent = `✓ GLB 已转换并进入 Pixi 排序层\n` +
    `树冠切面色差 ${facetEl.value}%\n` +
    `模拟光 ${renderSettings.light.label}\n` +
    `源模型包围盒 ${ss.x.toFixed(2)} × ${ss.z.toFixed(2)} × ${ss.y.toFixed(2)}\n` +
    `烘焙纹理 ${baked.canvas.width} × ${baked.canvas.height}px\n` +
    `地面锚点 ${(baked.anchor.x * 100).toFixed(1)}%, ${(baked.anchor.y * 100).toFixed(1)}%`;
}

async function main() {
  renderSettings = await loadRenderSettings();
  facetEl.value = String(renderSettings.facetContrast);
  outlineEl.checked = renderSettings.outlineVisible;
  makeCurrentTree(-330, 1600);
  const baked = await bakeTree();
  const imported = makeImportedTree(baked, 280, 1600);

  await Promise.all([
    makeNpc(280, 1465, 0x666666, 1),
    makeNpc(280, 1660, 0x292929, -1),
    makeNpc(-330, 1465, 0x666666, 1),
    makeNpc(-330, 1660, 0x292929, -1),
  ]);

  const update = () => {
    fitCamera();
    resizeImported(imported);
    document.getElementById('facetValue').textContent = facetEl.value + '%';
  };
  zoomEl.addEventListener('input', update);
  heightEl.addEventListener('input', update);
  outlineEl.addEventListener('change', update);
  let facetTimer = 0;
  let facetVersion = 0;
  facetEl.addEventListener('input', () => {
    update();
    clearTimeout(facetTimer);
    const version = ++facetVersion;
    statusEl.className = '';
    statusEl.textContent = `正在按 ${facetEl.value}% 重新生成树冠切面……`;
    facetTimer = setTimeout(async () => {
      try {
        const next = await bakeTree();
        if (version !== facetVersion) return;
        replaceImportedTexture(imported, next);
        update();
        showStatus(next);
        window.__assetSpike.baked = next;
      } catch (err) {
        statusEl.className = 'err';
        statusEl.textContent = '切面更新失败：' + err.message;
        console.error(err);
      }
    }, 120);
  });
  for (const b of document.querySelectorAll('[data-zoom]')) b.addEventListener('click', () => {
    zoomEl.value = b.dataset.zoom;
    update();
  });
  update();

  showStatus(baked);
  window.__assetSpike = { ready: true, baked, imported, renderSettings };
}

main().catch(err => {
  console.error(err);
  statusEl.className = 'err';
  statusEl.textContent = '转换失败：' + err.message;
  window.__assetSpike = { ready: false, error: err.message };
});
</script>
</body>
</html>
